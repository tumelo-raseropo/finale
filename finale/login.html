<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 20px;
            width: 350px;
            margin: 30px auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 5px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            box-sizing: border-box;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
        }
        button:hover {
            opacity: 0.8;
        }
        .error {
            color: red;
            font-size: 14px;
            margin: 10px 0;
        }
        .success {
            color: green;
            font-size: 16px;
            margin: 15px 0;
            font-weight: bold;
        }
        .switch-form {
            text-align: center;
            margin-top: 15px;
            color: #666;
        }
        .switch-form a {
            color: #4CAF50;
            text-decoration: none;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        hr {
            border: 1px solid #f1f1f1;
            margin-bottom: 20px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <hr>
        
        <div id="login-form">
            <label><b>Email</b></label>
            <input type="email" placeholder="Enter Email" id="email" required>

            <label><b>Password</b></label>
            <input type="password" placeholder="Enter Password" id="password" required>
            <div id="error" class="error"></div>

            <button type="submit" id="login-btn">Login</button>
        </div>
        
        <div id="success-message" class="success hidden">
            Successful login! Redirecting...
        </div>
        
        <div class="switch-form">
            New user? <a href="signup.html">Sign up here</a>
        </div>
    </div>

    <script>
        document.getElementById('login-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success-message');
            const loginForm = document.getElementById('login-form');
            
            errorDiv.textContent = '';
            
            // Show loading state
            const submitBtn = e.target;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            try {
                // Fetch all users from SheetDB
                const response = await fetch("https://sheetdb.io/api/v1/5c73ev7sar4xu");
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }
                
                const users = await response.json();
                
                // Find matching user (case-insensitive email)
                const user = users.find(u => 
                    u.email && 
                    u.email.toLowerCase() === email.toLowerCase() && 
                    u.password === password
                );
                
                if (user) {
                    // Show success message and hide form
                    loginForm.classList.add('hidden');
                    successDiv.classList.remove('hidden');
                    
                    // Set authentication flag
                    sessionStorage.setItem('authenticated', 'true');
                    
                    // Redirect to index.html after 2 seconds
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 2000);
                } else {
                    throw new Error("Invalid email or password");
                }
            } catch (error) {
                errorDiv.textContent = error.message.includes("Invalid") 
                    ? "Invalid email or password" 
                    : "Login failed. Please try again.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
